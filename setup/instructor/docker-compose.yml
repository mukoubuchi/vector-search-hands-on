services:
  # OpenSearch (single node, k-NN plugin bundled in the official distribution)
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    profiles: ["opensearch", "all"]
    environment:
      - discovery.type=single-node
      - cluster.name=vector-search-hands-on
      - node.name=opensearch
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # Generated into setup/instructor/.env by start-all.sh on first start.
      # The security plugin refuses to start without a compliant password.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?run ./start-all.sh, which generates this}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      # Participants connect here over HTTPS (self-signed certificate)
      - "9200:9200"
      # Performance analyzer is for the instructor machine only
      - "127.0.0.1:9600:9600"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sk -u "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
          https://localhost:9200/_cluster/health
          | grep -qE '"status":"(green|yellow)"'
      interval: 15s
      start_period: 60s
      timeout: 10s
      retries: 10

  # MkDocs documentation server (for sharing)
  # Note: On macOS container VMs (Colima, Podman, etc.), automatic
  # file change detection does not work
  # Use `python -m mkdocs serve` (port 8000) for development
  # This container is for sharing with participants (port 8001)
  mkdocs:
    # Image is built once from mkdocs.Dockerfile (plugin versions pinned in
    # sync with .github/workflows/ci.yml); no network needed after the build
    build:
      context: .
      dockerfile: mkdocs.Dockerfile
    profiles: ["docs", "all"]
    container_name: vector-search-docs
    ports:
      - "8001:8000"
    volumes:
      - ../../:/docs
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    restart: unless-stopped

volumes:
  opensearch_data:

# Profile usage examples:
# - Start all services:    docker compose --profile all up -d
# - OpenSearch only:       docker compose --profile opensearch up -d
# - Documentation only:    docker compose --profile docs up -d
# - Stop all services:     docker compose --profile all down
#
# The index format is tied to the OpenSearch major version. When upgrading
# across majors, reset the volume first (sample data is simply re-inserted):
#   docker compose --profile all down -v
