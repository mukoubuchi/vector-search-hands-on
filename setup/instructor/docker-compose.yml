services:
  # Milvus standalone in a single container: embedded etcd for metadata and
  # local storage on the milvus_data volume, as in the official Milvus
  # standalone_embed.sh script (no separate etcd or object storage service)
  milvus:
    image: milvusdb/milvus:v2.6.24
    profiles: ["milvus", "all"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
      MQ_TYPE: woodpecker
      # Woodpecker writes its log to object storage by default; keep it on
      # the local volume as well
      WOODPECKER_STORAGE_TYPE: local
      # Enforce user/password authentication (without this, any credentials are accepted)
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    ports:
      - "19530:19530"
      # Metrics endpoint is for the instructor machine only
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # MkDocs documentation server (for sharing)
  # Note: On macOS container VMs (Colima, Docker Desktop, etc.), automatic
  # file change detection does not work
  # Use `python -m mkdocs serve` (port 8000) for development
  # This container is for sharing with participants (port 8001)
  mkdocs:
    # Image is built once from mkdocs.Dockerfile (plugin versions pinned in
    # sync with .github/workflows/ci.yml); no network needed after the build
    build:
      context: .
      dockerfile: mkdocs.Dockerfile
    profiles: ["docs", "all"]
    container_name: vector-search-docs
    ports:
      - "8001:8000"
    volumes:
      - ../../:/docs
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    restart: unless-stopped

volumes:
  milvus_data:

# Profile usage examples:
# - Start all services:    docker compose --profile all up -d
# - Milvus only:           docker compose --profile milvus up -d
# - Documentation only:    docker compose --profile docs up -d
# - Stop all services:     docker compose --profile all down
#
# Upgrading from the etcd + MinIO layout (v1.11.0 and earlier) or from
# Milvus 2.3.x: existing data is not carried over. Remove the old volumes
# first (sample data can simply be re-inserted):
#   docker compose --profile all down -v
#   docker volume rm instructor_etcd_data instructor_minio_data
