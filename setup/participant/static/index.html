<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Generic fallback: app.js replaces the title with SHOP_NAME -->
  <title>Product search</title>
  <!-- An empty icon keeps the browser from requesting /favicon.ico -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title" data-text="shopName"></h1>
    </div>
  </header>

  <main class="container">
    <form id="search-form" class="search-panel" role="search">
      <div class="search-row">
        <label for="query" class="visually-hidden" data-text="queryLabel"></label>
        <input id="query" name="q" type="search" autocomplete="off" required>
        <button type="submit" id="search-button" class="search-button" data-text="searchButton"></button>
      </div>

      <div class="examples">
        <span class="examples-label" data-text="examplesLabel"></span>
        <div id="examples" class="example-list"></div>
      </div>

      <div class="options">
        <div class="option">
          <label for="top-k" data-text="topKLabel"></label>
          <select id="top-k" name="top_k">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
          </select>
        </div>

        <!-- Enabled only when the /search API accepts min_price and max_price -->
        <fieldset id="price-filter" class="option price-filter" disabled>
          <legend data-text="priceLabel"></legend>
          <div class="price-inputs">
            <label for="min-price" class="visually-hidden" data-text="priceMin"></label>
            <input id="min-price" name="min_price" type="number" min="0" step="1000" inputmode="numeric">
            <span aria-hidden="true">–</span>
            <label for="max-price" class="visually-hidden" data-text="priceMax"></label>
            <input id="max-price" name="max_price" type="number" min="0" step="1000" inputmode="numeric">
          </div>
          <p id="price-note" class="price-note" data-text="priceNote"></p>
        </fieldset>
      </div>
    </form>

    <div class="results-header">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <p id="legend" class="legend" hidden></p>
    </div>
    <ol id="results" class="results"></ol>
  </main>
</body>
</html>
