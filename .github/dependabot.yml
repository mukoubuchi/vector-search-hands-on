version: 2
updates:
  # Participant Python dependencies (exact pins in requirements.txt)
  - package-ecosystem: pip
    directory: /setup/participant
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # A pymilvus major bump goes together with the docker-compose Milvus
      # image and the docs. Minor updates come through here: the participant
      # scripts and the Bob mode rules use MilvusClient, not the ORM-style API
      # that PyMilvus 3.1 removes
      - dependency-name: pymilvus
        update-types: ["version-update:semver-major"]
      # These decide the embeddings, so the search results in the docs change
      # with them; major bumps are done deliberately with the docs re-measured
      - dependency-name: sentence-transformers
        update-types: ["version-update:semver-major"]
      - dependency-name: transformers
        update-types: ["version-update:semver-major"]
      - dependency-name: torch
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Container images in the instructor docker-compose stack
  - package-ecosystem: docker-compose
    directory: /setup/instructor
    schedule:
      interval: monthly
    ignore:
      # A Milvus major upgrade changes the server the hands-on is written for;
      # it is done deliberately together with pymilvus and the docs
      - dependency-name: milvusdb/milvus
        update-types: ["version-update:semver-major"]

  # Base image in mkdocs.Dockerfile (the compose service builds a local tag,
  # so the docker-compose ecosystem cannot see this image)
  - package-ecosystem: docker
    directory: /setup/instructor
    schedule:
      interval: monthly
