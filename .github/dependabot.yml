version: 2
updates:
  # Participant Python dependencies (exact pins in requirements.txt)
  - package-ecosystem: pip
    directory: /setup/participant
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # The opensearch-py major version must match the OpenSearch server;
      # bump it together with the docker-compose OpenSearch image instead
      - dependency-name: opensearch-py
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Container images in the instructor docker-compose stack
  - package-ecosystem: docker-compose
    directory: /setup/instructor
    schedule:
      interval: monthly

  # Base image in mkdocs.Dockerfile (the compose service builds a local tag,
  # so the docker-compose ecosystem cannot see this image)
  - package-ecosystem: docker
    directory: /setup/instructor
    schedule:
      interval: monthly
