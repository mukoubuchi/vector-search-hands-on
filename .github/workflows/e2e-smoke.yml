name: E2E Smoke Test

# Full-stack test: starts the instructor environment (including credential
# generation), then runs the participant flow (connection test, data insertion,
# keyword/vector/hybrid search) end to end.
# The participant flow needs IBM watsonx.ai credentials, so the run is skipped
# when the repository has no watsonx.ai secrets configured.
# Runs automatically when the runtime stack changes; can also be triggered
# manually before a release.

on:
  workflow_dispatch:
  schedule:
    # Monthly health check for upstream rot (new images/wheels),
    # aligned with the monthly Dependabot cycle
    - cron: '0 3 1 * *'
  push:
    branches:
      - main
    paths:
      - 'setup/participant/**'
      - 'setup/instructor/docker-compose.yml'
      - 'setup/instructor/mkdocs.Dockerfile'
      - 'setup/instructor/start-all.sh'
      - 'setup/instructor/stop-all.sh'
      - 'lib/common.sh'
      - '.github/workflows/e2e-smoke.yml'
  pull_request:
    paths:
      - 'setup/participant/**'
      - 'setup/instructor/docker-compose.yml'
      - 'setup/instructor/mkdocs.Dockerfile'
      - 'setup/instructor/start-all.sh'
      - 'setup/instructor/stop-all.sh'
      - 'lib/common.sh'
      - '.github/workflows/e2e-smoke.yml'

permissions:
  contents: read

# A newer commit supersedes the ~15-minute run for the same ref;
# cancel the outdated one to save Actions minutes
concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The secrets context cannot be read from a job-level `if`, so a tiny job
  # turns "are the watsonx.ai secrets configured?" into an output
  check-credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      - name: Check whether watsonx.ai secrets are configured
        id: probe
        env:
          WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
          WATSONX_PROJECT_ID: ${{ secrets.WATSONX_PROJECT_ID }}
        run: |
          if [ -n "$WATSONX_APIKEY" ] && [ -n "$WATSONX_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WATSONX_APIKEY / WATSONX_PROJECT_ID are not set; skipping the end-to-end run"
          fi

  e2e:
    needs: check-credentials
    if: needs.check-credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: setup/participant/requirements.txt

      - name: Install participant dependencies
        run: pip install -r setup/participant/requirements.txt

      - name: Start hands-on environment (generates credentials)
        working-directory: setup/instructor
        run: ./start-all.sh

      - name: Create participant .env from generated credentials
        env:
          WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
          WATSONX_PROJECT_ID: ${{ secrets.WATSONX_PROJECT_ID }}
          WATSONX_URL: ${{ secrets.WATSONX_URL }}
        run: |
          password="$(grep '^OPENSEARCH_PASSWORD=' setup/instructor/.env | cut -d= -f2-)"
          cat > setup/participant/.env <<EOF
          OPENSEARCH_HOST=localhost
          OPENSEARCH_PORT=9200
          OPENSEARCH_USER=admin
          OPENSEARCH_PASSWORD=$password
          OPENSEARCH_USE_SSL=true
          OPENSEARCH_VERIFY_CERTS=false
          IBM_API_KEY=$WATSONX_APIKEY
          WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
          WATSONX_PROJECT_ID=$WATSONX_PROJECT_ID
          EMBEDDING_MODEL_ID=ibm/granite-embedding-278m-multilingual
          INDEX_NAME=products_ci
          PARTICIPANT_LANGUAGE=en
          EOF

      - name: Connection test
        working-directory: setup/participant
        run: python test_connection.py

      - name: Insert sample data
        working-directory: setup/participant
        run: python insert_sample_data.py --yes

      - name: Re-insert sample data (delete confirmation bypass)
        working-directory: setup/participant
        run: python insert_sample_data.py --yes

      - name: Start demo app and run all three search modes
        working-directory: setup/participant
        run: |
          nohup python app.py > app.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8002/health > /dev/null && break
            sleep 2
          done
          echo "--- /health ---"
          curl -sf http://localhost:8002/health
          echo ""
          for mode in keyword vector hybrid; do
            echo "--- /search ($mode) ---"
            curl -sf -X POST http://localhost:8002/search \
              -H 'Content-Type: application/json' \
              -d "{\"query\": \"red sneakers\", \"mode\": \"$mode\", \"top_k\": 3}" \
              | tee "search-$mode.json"
            echo ""
          done
          python - <<'PYEOF'
          import json

          for mode in ("keyword", "vector", "hybrid"):
              with open(f"search-{mode}.json") as f:
                  data = json.load(f)
              assert data["results"], f"{mode} search returned no results"
              print(f"{mode} OK:", data["results"][0]["product_name"])
          PYEOF

      - name: Show logs on failure
        if: failure()
        run: |
          cat setup/participant/app.log 2>/dev/null || true
          cd setup/instructor && docker compose --profile all logs --tail 100

      - name: Stop environment
        if: always()
        working-directory: setup/instructor
        run: ./stop-all.sh
