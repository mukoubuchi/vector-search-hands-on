# Site settings
site_name: Vector Search Hands-on
site_description: Milvus-based vector search hands-on using IBM Bob, Building Blocks, FastAPI, and Hugging Face embeddings
site_author: IBM Build Team
site_url: !ENV [SITE_URL, 'http://localhost:8000/']
docs_dir: docs
site_dir: site
exclude_docs: |
  readme.md
  translation-sync.md

# Theme settings
theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  # Load bundled IBM Plex fonts through local CSS; do not request Google Fonts.
  font: false

# Repository info (kept out of the header; the source URL is listed in the home page)
# repo_name: vector-search-hands-on
# repo_url: https://github.com/mukoubuchi/vector-search-hands-on

# Navigation structure
nav:
  - Home: index.md
  - Preparation: preparation.md
  - Part 1: part1.md
  - Part 2: part2.md
  - Part 3: part3.md
  - Summary: summary.md
  - Feedback: feedback.md

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference

# Plugin settings
plugins:
  - search:
      lang:
        - en
        - ja
  - i18n:
      docs_structure: folder
      # Use stable language roots with Material instant navigation.
      reconfigure_material: false
      languages:
        - locale: en
          name: English
          build: true
          default: true
          theme:
            language: en
          site_name: Vector Search Hands-on
        - locale: ja
          name: 日本語
          build: true
          theme:
            language: ja
          site_name: Vector Search ハンズオン
          nav_translations:
            Home: ホーム
            Preparation: 事前準備
            Part 1: Part 1
            Part 2: Part 2
            Part 3: Part 3
            Summary: まとめ
            Feedback: フィードバック

# Extra settings
extra:
  generator: false
  # language-switcher.js rewrites these roots to the current page on each view.
  alternate:
    - name: English
      link: /
      lang: en
    - name: 日本語
      link: /ja/
      lang: ja

# Custom CSS (modularized)
extra_css:
  - stylesheets/extra.css

# Custom JavaScript (modularized)
extra_javascript:
  - javascripts/site-config.js
  - javascripts/search.js
  - javascripts/navigation.js
  - javascripts/selector-indicator.js
  - javascripts/toc-indicator.js
  - javascripts/steps.js
  - javascripts/tasks.js
  - javascripts/feedback.js
  - javascripts/syntax-highlight.js
  - javascripts/language-switcher.js
